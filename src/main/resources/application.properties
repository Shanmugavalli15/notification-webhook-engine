spring.application.name=hookflow
server.port=${PORT:8080}

# Database (H2 dev database)
spring.datasource.url=jdbc:h2:mem:hookflow;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HookFlow JWT Configuration
hookflow.jwt.secret=hookflow-production-grade-super-secret-key-32-bytes-minimum
hookflow.jwt.expiration-ms=86400000

# CORS & Localhost settings
hookflow.allow-localhost=true
hookflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Webhook Retry & Exponential Backoff settings
hookflow.retry.base-delay-ms=2000
hookflow.retry.max-delay-ms=60000
hookflow.retry.jitter-factor=0.25
hookflow.retry.scheduler-interval-ms=10000

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Logging
logging.level.com.example.notification=INFO
logging.level.org.springframework.security=INFO
