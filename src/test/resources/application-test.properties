# Test profile — uses in-memory H2, no file persistence
spring.datasource.url=jdbc:h2:mem:hookflow_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=false

# JWT for tests
hookflow.jwt.secret=hookflow-test-secret-key-must-be-at-least-32-characters-long-ok
hookflow.jwt.expiration-ms=3600000

hookflow.allow-localhost=true
hookflow.cors.allowed-origins=http://localhost:5173

hookflow.retry.base-delay-ms=100
hookflow.retry.max-delay-ms=500
hookflow.retry.jitter-factor=0.0
hookflow.retry.scheduler-interval-ms=999999

logging.level.com.example.notification=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN

springdoc.swagger-ui.enabled=false
